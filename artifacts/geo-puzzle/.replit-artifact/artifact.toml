kind = "web"
previewPath = "/"
title = "GeoPuzzle"
description = "A geography puzzle game based on the existing GeoPuzzle repository, with a polished playable experience and reliable account authentication flows."
version = "1.0.0"
id = "artifacts/geo-puzzle"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21618

[services.development]
run = "pnpm --filter @workspace/geo-puzzle run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/geo-puzzle", "run", "build" ]
serve = "static"
publicDir = "artifacts/geo-puzzle/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21618"
BASE_PATH = "/"
